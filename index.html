<!DOCTYPE html>
<html>
<head>
  <title>PC Support Chatbot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="chat-container">

  <div class="header">
    PC/Laptop Support Assistant
  </div>

  <div id="chat-box"></div>

  <div class="input-area">
    <input type="text" id="user-input" placeholder="Ask your issue...">
    <button onclick="sendMessage()">Send</button>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
